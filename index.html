<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banka & IBAN Bilgileri</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; max-width: 400px; width: 100%; text-align: center; }
    h2 { margin: 0 0 8px 0; color: #1a1a1a; font-size: 20px; }
    p { margin: 0 0 20px 0; color: #666; font-size: 14px; }
    .iban-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 16px; font-weight: bold; color: #0f172a; margin-bottom: 12px; letter-spacing: 1px; word-break: break-all; }
    .btn { background: #0f172a; color: #ffffff; border: none; border-radius: 8px; padding: 14px 20px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn:active { background: #334155; }
    .info { margin-top: 16px; font-size: 13px; color: #64748b; background: #eff6ff; padding: 10px; border-radius: 8px; border: 1px solid #dbeafe; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Ödeme Bilgileri</h2>
    <p>Alıcı: <strong>FİRMA / AD SOYAD</strong></p>
    
    <div class="iban-box" id="ibanText">TR00 0000 0000 0000 0000 0000 00</div>
    <button class="btn" onclick="copyIban()">IBAN'ı Kopyala</button>

    <div class="info">
      <strong>Açıklama Kısmına:</strong><br>
      TC Kimlik Numaranız ve Altın Ödemesi yazınız.
    </div>
  </div>

  <script>
    function copyIban() {
      const iban = "TR000000000000000000000000"; // Buraya boşluksuz IBAN yazın
      navigator.clipboard.writeText(iban).then(() => {
        alert("IBAN panoya kopyalandı!");
      });
    }
  </script>
</body>
</html>
